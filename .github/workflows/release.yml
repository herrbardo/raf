name: Release del cliente

# Al pushear un tag v1.2.3: compila, empaqueta con Velopack y publica en GitHub Releases. La app instalada busca
# ahí sus actualizaciones. Las firmas se activan solas cuando existen sus secretos (ver docs/plans/06-distribucion.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # crear el release y subir los archivos con el GITHUB_TOKEN

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACK_ID: RequestsAndFriends # define la carpeta de instalación: distinta de la de datos (%LOCALAPPDATA%\RAF)
  PACK_TITLE: RAF
  PACK_AUTHORS: Herr Bardo # editor que muestra el sistema al instalar
  VPK_VERSION: 1.2.161 # igual a la versión del paquete Velopack del cliente
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "El tag $env:GITHUB_REF_NAME no es una versión semántica (v1.2.3)." }
          "version=$version" >> $env:GITHUB_OUTPUT
          # v1.2.3-beta.1 se publica como prerelease: la app estable no la ve como actualización.
          "pre=$(if ($version.Contains('-')) { '--pre' })" >> $env:GITHUB_OUTPUT

      - name: Publicar
        run: >-
          dotnet publish src/Raf.Client/Raf.Client.csproj -c Release -r win-x64 --self-contained -o publish
          -p:Version=${{ steps.version.outputs.version }} -p:RafUpdateUrl=${{ env.REPO_URL }}

      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # El release anterior permite generar el paquete delta (actualizaciones más chicas). En el primero no hay.
      - name: Bajar el release anterior
        run: >-
          vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} --channel win -o releases
          ${{ steps.version.outputs.pre }}
        continue-on-error: true

      - name: Certificado de firma
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'firma.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_PFX))
          "CERT_PATH=$path" >> $env:GITHUB_ENV

      - name: Empaquetar
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $vpkArgs = @(
            'pack', '--packId', $env:PACK_ID, '--packVersion', '${{ steps.version.outputs.version }}',
            '--packDir', 'publish', '--mainExe', 'RAF.exe', '--packTitle', $env:PACK_TITLE, '--packAuthors', $env:PACK_AUTHORS,
            '--icon', 'src/Raf.Client/Assets/raf.ico', '--channel', 'win', '-o', 'releases')
          if ($env:CERT_PATH) {
            $vpkArgs += '--signParams', "/f `"$env:CERT_PATH`" /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256"
          } else {
            Write-Warning 'Sin certificado: el instalador no va firmado y SmartScreen va a advertir al instalar.'
          }
          vpk @vpkArgs
          if ($LASTEXITCODE -ne 0) { throw 'Falló vpk pack.' }

      - name: Borrar el certificado
        if: always() && env.CERT_PATH != ''
        shell: pwsh
        run: Remove-Item $env:CERT_PATH -Force

      - name: Publicar el release
        run: >-
          vpk upload github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} -o releases
          --channel win --publish ${{ steps.version.outputs.pre }} --releaseName "RAF ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }}

  # macOS se publica recién cuando están cargados los secretos de Apple (D6). Hasta entonces el job no corre.
  macos-habilitado:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          APP_CERT: ${{ secrets.MACOS_APP_CERTIFICATE_P12 }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -n "$APP_CERT" ] && [ -n "$INSTALLER_CERT" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan los secretos de Apple: este release es solo para Windows."
          fi

  macos:
    needs: [windows, macos-habilitado]
    if: needs.macos-habilitado.outputs.enabled == 'true'
    runs-on: macos-latest
    strategy:
      max-parallel: 1 # los dos suben al mismo release
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Versión
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "pre=--pre" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar
        run: >-
          dotnet publish src/Raf.Client/Raf.Client.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish
          -p:Version=${{ steps.version.outputs.version }} -p:RafUpdateUrl=${{ env.REPO_URL }}

      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Certificados y notarización
        env:
          APP_CERT: ${{ secrets.MACOS_APP_CERTIFICATE_P12 }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/firma.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for cert in "$APP_CERT" "$INSTALLER_CERT"; do
            echo "$cert" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            rm "$RUNNER_TEMP/cert.p12"
          done
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials raf-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Bajar el release anterior
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} --channel ${{ matrix.rid }} -o releases ${{ steps.version.outputs.pre }}
        continue-on-error: true

      - name: Empaquetar, firmar y notarizar
        env:
          APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: >-
          vpk pack --packId $PACK_ID --packVersion ${{ steps.version.outputs.version }} --packDir publish
          --mainExe RAF --packTitle $PACK_TITLE --packAuthors "$PACK_AUTHORS" --icon src/Raf.Client/Assets/raf.icns
          --channel ${{ matrix.rid }} -o releases
          --signAppIdentity "$APP_IDENTITY" --signInstallIdentity "$INSTALLER_IDENTITY"
          --notaryProfile raf-notary --keychain "$KEYCHAIN"

      - name: Agregar al release
        run: >-
          vpk upload github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} -o releases
          --channel ${{ matrix.rid }} --merge --publish ${{ steps.version.outputs.pre }} --releaseName "RAF ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }}

      - name: Borrar el keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"
